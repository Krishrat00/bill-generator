<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f6fa;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            margin-bottom: 30px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #2f3640;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        button {
            padding: 5px 10px;
            margin: 3px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn {
            background: #e84118;
            color: white;
        }

        .approve-btn {
            background: #44bd32;
            color: white;
        }

        .reject-btn {
            background: #e1b12c;
            color: white;
        }

        .add-btn {
            background: #0097e6;
            color: white;
            float: right;
            margin-bottom: 10px;
        }

        .logout-btn {
            background: #718093;
            color: white;
            float: right;
            margin-left: 10px;
        }

        .analytics-link {
            display: inline-block;
            padding: 7px 10px;
            border-radius: 4px;
            background: #155e4b;
            color: white;
            text-decoration: none;
        }

        select,
        input {
            padding: 6px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .bulk-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0;
        }

        .bulk-actions[hidden] { display: none; }
        .bulk-actions button { background: #17634d; color: white; padding: 8px 12px; }
        .bulk-actions span { color: #555; font-size: 14px; }
        .pending-select, #selectAllPending { width: 18px; height: 18px; cursor: pointer; }
    </style>
</head>

<body>
    <div class="top-bar">
        <h2>Admin Panel</h2>
        <div>
            <a class="analytics-link" href="/admin/analytics">Bill Analytics</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div>
        <label for="tableSelect">Select Table:</label>
        <select id="tableSelect">
            <option value="parties">Parties</option>
            <option value="transports">Transports</option>
            <option value="cities">Cities</option>
            <option value="pending_requests">Pending Requests</option>
            <option value="bank_details">Bank Details</option>
            <option value="bills">Recent Bills</option>
        </select>
        <button class="add-btn" onclick="addRecord()">+ Add Record</button>
    </div>

    <div id="bulkActions" class="bulk-actions" hidden>
        <span id="selectedCount" aria-live="polite">0 selected</span>
        <button id="bulkApproveButton" type="button">Approve selected</button>
    </div>

    <table id="dataTable">
        <thead></thead>
        <tbody></tbody>
    </table>

    <script>
        const tableSelect = document.getElementById('tableSelect');
        const dataTable = document.getElementById('dataTable');
        const bulkActions = document.getElementById('bulkActions');
        const selectedCount = document.getElementById('selectedCount');
        const bulkApproveButton = document.getElementById('bulkApproveButton');
        let pendingRows = [];

        async function loadTable() {
            const table = tableSelect.value;
            const endpoint = table === 'bills' ? '/admin/bills?limit=50' : `/admin/data?table=${table}`;
            const res = await fetch(endpoint);
            if (res.status === 401) {
                window.location.href = '/admin/login';
                return;
            }
            const data = await res.json();
            renderTable(data, table);
        }

        function renderTable(data, table) {
            const thead = dataTable.querySelector('thead');
            const tbody = dataTable.querySelector('tbody');
            pendingRows = table === 'pending_requests' ? data || [] : [];
            thead.innerHTML = '';
            tbody.innerHTML = '';
            updateBulkControls();

            if (!data || data.length === 0) {
                thead.innerHTML = '<tr><th>No Data Found</th></tr>';
                return;
            }

            const keys = Object.keys(data[0]);
            const selectionHeader = table === 'pending_requests'
                ? '<th><input id="selectAllPending" type="checkbox" aria-label="Select all pending requests"></th>'
                : '';
            thead.innerHTML = `<tr>${selectionHeader}${keys.map(k => `<th>${k}</th>`).join('')}<th>Actions</th></tr>`;

            data.forEach((row, index) => {
                let rowHTML = '<tr>';
                if (table === 'pending_requests') {
                    rowHTML += `<td><input class="pending-select" type="checkbox" value="${index}" aria-label="Select pending request"></td>`;
                }
                keys.forEach(k => rowHTML += `<td>${row[k]}</td>`);
                if (table !== 'bills' && table !== 'pending_requests') {
                    rowHTML += `<td>
                        <button class="delete-btn" onclick="deleteRecord('${table}', '${row.id}')">Delete</button>
                    </td>`;
                }
                if (table === 'pending_requests') {
                    rowHTML += `<td>
                        <button class="approve-btn" onclick="approve('${row.type}', '${row.name}')">Approve</button>
                        <button class="reject-btn" onclick="reject('${row.type}', '${row.name}')">Reject</button>
                    </td>`;
                }
                if (table === 'bills') {
                    rowHTML += `<td><button class="approve-btn" onclick="viewBill('${encodeURIComponent(row.invoice_no)}')">View</button></td>`;
                }
                rowHTML += '</tr>';
                tbody.innerHTML += rowHTML;
            });
            updateBulkControls();
        }

        function updateBulkControls() {
            const selected = dataTable.querySelectorAll('tbody .pending-select:checked').length;
            bulkActions.hidden = tableSelect.value !== 'pending_requests' || selected === 0;
            selectedCount.textContent = `${selected} selected`;
            bulkApproveButton.disabled = selected === 0;
            const selectAll = document.getElementById('selectAllPending');
            if (selectAll) {
                const checkboxes = dataTable.querySelectorAll('tbody .pending-select');
                selectAll.checked = checkboxes.length > 0 && selected === checkboxes.length;
                selectAll.indeterminate = selected > 0 && selected < checkboxes.length;
            }
        }

        async function approveSelected() {
            const selected = Array.from(dataTable.querySelectorAll('tbody .pending-select:checked'))
                .map(checkbox => pendingRows[Number(checkbox.value)])
                .filter(row => row)
                .map(row => ({ type: row.type, name: row.name }));
            if (!selected.length || !confirm(`Approve ${selected.length} selected requests?`)) return;

            const res = await fetch('/admin/approve-bulk', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ requests: selected })
            });
            if (res.status === 401) {
                window.location.href = '/admin/login';
                return;
            }
            const result = await res.json();
            if (!res.ok) {
                alert(result.error || 'Could not approve selected requests.');
                return;
            }
            const failedCount = result.failed.length;
            alert(`${result.approved} approved${failedCount ? `, ${failedCount} could not be approved` : ''}.`);
            await loadTable();
        }

        async function viewBill(invoiceNo) {
            const res = await fetch(`/admin/bills/${invoiceNo}`);
            if (res.status === 401) {
                window.location.href = '/admin/login';
                return;
            }
            const bill = await res.json();
            if (!res.ok) {
                alert(bill.error || 'Bill not found');
                return;
            }
            alert(JSON.stringify(bill, null, 2));
        }

        async function deleteRecord(table, id) {
            if (!confirm('Are you sure you want to delete this record?')) return;
            await fetch('/admin/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ table, id })
            });
            loadTable();
        }

        async function approve(type, name) {
            const res = await fetch(`/admin/approve/${type}/${encodeURIComponent(name)}`);
            if (res.status === 401) {
                alert("⚠️ Session expired. Please log in again.");
                window.location.href = '/admin/login';
                return;
            }
            if (res.ok) {
                alert("✅ Approved successfully!");
                loadTable();
            } else {
                alert("❌ Error approving record.");
            }
        }


        async function reject(type, name) {
            const res = await fetch(`/admin/reject/${type}/${encodeURIComponent(name)}`);
            if (res.status === 401) {
                alert("⚠️ Session expired. Please log in again.");
                window.location.href = '/admin/login';
                return;
            }
            if (res.ok) {
                alert("✅ Rejected successfully!");
                loadTable();
            } else {
                alert("❌ Error approving record.");
            }
        }

        async function addRecord() {
            const table = tableSelect.value;
            const payload = { table };

            if (table === 'parties') {
                payload.name = prompt('Party Name:');
                payload.gstin = prompt('GSTIN:');
                payload.place = prompt('Place:');
                payload.fixed_place = confirm('Fixed place? (OK for Yes)');
            } else if (table === 'transports') {
                payload.name = prompt('Transport Name:');
                payload.gstin = prompt('GSTIN:');
            } else if (table === 'cities') {
                payload.city = prompt('City:');
                payload.state = prompt('State:');
            } else if (table === 'pending_requests') {
                payload.type = prompt('Type (party/transport):');
                payload.name = prompt('Name:');
                payload.gstin = prompt('GSTIN:');
                payload.place = prompt('Place (optional):');
            } else if (table === 'bank_details') {
                payload.bank_name = prompt('Bank Name:');
                payload.account_number = prompt('Account Number:');
                payload.ifsc = prompt('IFSC Code:');
            } else {
                alert('Add operation not supported for this table.');
                return;
            }

            await fetch('/admin/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            loadTable();
        }

        function logout() {
            window.location.href = '/admin/logout';
        }

        dataTable.addEventListener('change', event => {
            if (event.target.id === 'selectAllPending') {
                dataTable.querySelectorAll('tbody .pending-select').forEach(checkbox => {
                    checkbox.checked = event.target.checked;
                });
            }
            if (event.target.id === 'selectAllPending' || event.target.classList.contains('pending-select')) {
                updateBulkControls();
            }
        });
        bulkApproveButton.addEventListener('click', approveSelected);
        tableSelect.addEventListener('change', loadTable);
        window.onload = loadTable;
    </script>
</body>

</html>
